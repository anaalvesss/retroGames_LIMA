<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Retro Games🎮</h1>
        <p>Catálogo de jogos retrô</p>
        <div class="logo-container">
            <img src="logo.png" alt="Logo Retro Games" class="logo-img">
        </div>
    </header>
    <main>
        <div class="topo">
            <h2>Jogos cadastrados</h2>
            <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>   
        </div>
        <section id="listaJogos" class="jogos"></section>
        <p id="mensagemVazia">Nenhum jogo cadastrado.</p>
    </main>

    <dialog id="modalCadastro">
        <form id="formJogo">
            <h2>Cadastrar Jogo</h2>
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required>
            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" required>
            <label for="desenvolvedora">Desenvolvedora</label>
            <input type="text" id="desenvolvedora" required>
            <label for="imagem_url">URL da imagem</label>
            <input type="url" id="imagem_url" required>
            <label for="preco">Preço</label>
            <input type="number" id="preco" min="0" step="0.01" required>
            <div class="botoes">
            <button type="button" id="btnCancelar">Cancelar</button>
            <button type="submit">Salvar</button>
        </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
